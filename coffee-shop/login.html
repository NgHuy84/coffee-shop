<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Coffee House</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(20, 15, 12, .7), rgba(20, 15, 12, .7)),
                url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            font-family: Arial, Helvetica, sans-serif;
        }

        .login-box {

            width: 430px;

            background: rgba(255, 255, 255, .08);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, .2);

            border-radius: 25px;

            padding: 45px;

            color: white;

            animation: fadeUp .8s;
        }

        @keyframes fadeUp {

            from {

                opacity: 0;
                transform: translateY(40px);

            }

            to {

                opacity: 1;
                transform: translateY(0);

            }

        }

        h1 {

            text-align: center;

            margin-bottom: 10px;

            font-weight: bold;

        }

        .subtitle {

            text-align: center;

            color: #ddd;

            margin-bottom: 35px;

        }

        .form-control {

            height: 55px;

            border-radius: 14px;

            border: none;

            background: rgba(255, 255, 255, .12);

            color: white;

        }

        .form-control::placeholder {

            color: #ddd;

        }

        .form-control:focus {

            background: rgba(255, 255, 255, .18);

            color: white;

            box-shadow: none;

        }

        .input-group-text {

            background: rgba(255, 255, 255, .12);

            border: none;

            color: white;

        }

        .btn-login {

            width: 100%;

            height: 55px;

            border: none;

            border-radius: 50px;

            background: #C79A63;

            color: white;

            font-weight: bold;

            transition: .3s;

        }

        .btn-login:hover {

            transform: translateY(-3px);

            background: #b98748;

        }

        a {

            color: #F5D6A1;

            text-decoration: none;

        }

        a:hover {

            color: white;

        }

        .logo {

            text-align: center;

            font-size: 55px;

            margin-bottom: 15px;

        }
    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">

            ☕

        </div>

        <h1>Coffee House</h1>

        <p class="subtitle">

            Đăng nhập để tiếp tục

        </p>

        <form>

            <div class="mb-3">

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-envelope"></i>

                    </span>

                    <input type="email" class="form-control" placeholder="Email">

                </div>

            </div>

            <div class="mb-3">

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>

                    <input type="password" class="form-control" placeholder="Mật khẩu">

                </div>

            </div>

            <div class="d-flex justify-content-between mb-4">

                <div>

                    <input type="checkbox">

                    Ghi nhớ

                </div>

                <a href="#">

                    Quên mật khẩu?

                </a>

            </div>

            <button class="btn-login" href="index.html">

                Đăng nhập

            </button>

        </form>

        <hr class="my-4">

        <p class="text-center">

            Chưa có tài khoản?

            <a href="register.html">

                Đăng ký ngay

            </a>

        </p>

        <p class="text-center mt-4">

            <a href="index.html">

                <i class="bi bi-arrow-left"></i>

                Quay về trang chủ
            </a>
        </p>
    </div>
</body>

</html>
