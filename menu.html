<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu | Coffee House</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="CSS/menu.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">

                ☕ Coffee House

            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Trang chủ
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="menu.html">
                            Menu
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Liên hệ
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="login.html">
                            <i class="bi bi-person-circle"></i>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-cart3"></i>
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Banner -->

    <section class="hero">

        <div class="overlay">

            <h1>

                OUR MENU

            </h1>

            <p>

                Premium Coffee Collection

            </p>

        </div>

    </section>

    <!-- Search -->

    <section class="container mt-5">

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input id="searchInput" type="text" placeholder="Tìm cà phê yêu thích...">

        </div>

    </section>

    <!-- Category -->

    <section class="container mt-4">

        <div class="category">

            <button class="active" data-filter="all">

                Tất cả

            </button>

            <button data-filter="Espresso">

                Espresso

            </button>

            <button data-filter="Latte">

                Latte

            </button>

            <button data-filter="Cold Brew">

                Cold Brew

            </button>

            <button data-filter="Tea">

                Tea

            </button>

            <button data-filter="Cake">

                Cake

            </button>

        </div>

    </section>

    <!-- Products -->

    <section class="container my-5">

        <div class="row g-4" id="product-list">

        </div>

    </section>

    <!-- Footer -->

    <footer>

        <h3>

            Coffee House

        </h3>

        <p>

            © 2026 All Rights Reserved.

        </p>

    </footer>

    <script src="JS/products.js"></script>
    <script src="JS/menu.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
