<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Latte | Coffee House</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="CSS/product.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">

                ☕ Coffee House

            </a>

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link" href="index.html">

                        Trang chủ

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link" href="menu.html">

                        Menu

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link" href="cart.html">

                        <i class="bi bi-cart3"></i>

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link" href="login.html">

                        <i class="bi bi-person-circle"></i>

                    </a>

                </li>

            </ul>

        </div>

    </nav>

    <div class="container product-section">

        <div class="row">

            <div class="col-lg-6">

                <img id="mainImage"
                    src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80"
                    class="img-fluid main-image">

                <div class="thumbs mt-3">

                    <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=300&q=80"
                        onclick="changeImage(this.src)">

                    <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=300&q=80"
                        onclick="changeImage(this.src)">

                    <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=300&q=80"
                        onclick="changeImage(this.src)">

                </div>

            </div>

            <div class="col-lg-6">

                <h1>Latte</h1>

                <div class="rating">

                    ★★★★★

                    <span>(245 đánh giá)</span>

                </div>

                <h2 class="price">

                    55.000₫

                </h2>

                <p>

                    Latte được pha từ Espresso kết hợp cùng sữa tươi tạo nên hương vị cân bằng, béo nhẹ và thơm ngon.

                </p>

                <h5>Chọn Size</h5>

                <div class="option-group">

                    <button>S</button>

                    <button class="active">M</button>

                    <button>L</button>

                </div>

                <h5>Độ ngọt</h5>

                <div class="option-group">

                    <button>0%</button>

                    <button>30%</button>

                    <button class="active">50%</button>

                    <button>100%</button>

                </div>

                <h5>Topping</h5>

                <div class="form-check">

                    <input class="form-check-input" type="checkbox">

                    <label>

                        Trân châu

                    </label>

                </div>

                <div class="form-check">

                    <input class="form-check-input" type="checkbox">

                    <label>

                        Kem Cheese

                    </label>

                </div>

                <div class="form-check">

                    <input class="form-check-input" type="checkbox">

                    <label>

                        Extra Shot Espresso

                    </label>

                </div>

                <div class="quantity mt-4">

                    <button onclick="minus()">

                        -

                    </button>

                    <input id="qty" type="text" value="1" readonly>

                    <button onclick="plus()">

                        +

                    </button>

                </div>

                <button class="btn-buy mt-4">

                    <i class="bi bi-cart-plus"></i>

                    Thêm vào giỏ hàng

                </button>

            </div>

        </div>

    </div>

    <footer>

        Coffee House © 2026

    </footer>

    <script src="JS/product.js"></script>

</body>

</html>
