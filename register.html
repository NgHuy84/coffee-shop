<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký | Coffee House</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(18, 14, 12, .75), rgba(18, 14, 12, .75)),
                url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

        }

        .register-box {

            width: 500px;

            background: rgba(255, 255, 255, .08);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, .15);

            border-radius: 25px;

            padding: 40px;

            color: white;

            animation: fadeUp .8s;

        }

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .logo {

            text-align: center;

            font-size: 55px;

            margin-bottom: 10px;

        }

        h2 {

            text-align: center;

            font-weight: bold;

        }

        .sub {

            text-align: center;

            color: #ddd;

            margin-bottom: 30px;

        }

        .input-group {

            margin-bottom: 18px;

        }

        .input-group-text {

            background: rgba(255, 255, 255, .12);

            color: white;

            border: none;

        }

        .form-control {

            background: rgba(255, 255, 255, .12);

            border: none;

            color: white;

            height: 52px;

        }

        .form-control::placeholder {

            color: #ddd;

        }

        .form-control:focus {

            background: rgba(255, 255, 255, .18);

            color: white;

            box-shadow: none;

        }

        .btn-register {

            width: 100%;

            height: 55px;

            border: none;

            border-radius: 50px;

            background: #C79A63;

            color: white;

            font-size: 18px;

            font-weight: bold;

            transition: .3s;

        }

        .btn-register:hover {

            background: #b88646;

            transform: translateY(-3px);

        }

        a {

            color: #F5D6A1;

            text-decoration: none;

        }

        a:hover {

            color: white;

        }

        .bottom {

            text-align: center;

            margin-top: 25px;

        }

        hr {

            border-color: rgba(255, 255, 255, .15);

            margin: 25px 0;

        }
    </style>

</head>

<body>

    <div class="register-box">

        <div class="logo">

            ☕

        </div>

        <h2>Coffee House</h2>

        <p class="sub">

            Tạo tài khoản mới

        </p>

        <form>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-person"></i>

                </span>

                <input type="text" class="form-control" placeholder="Họ và tên">

            </div>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-envelope"></i>

                </span>

                <input type="email" class="form-control" placeholder="Email">

            </div>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-telephone"></i>

                </span>

                <input type="text" class="form-control" placeholder="Số điện thoại">

            </div>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-lock"></i>

                </span>

                <input type="password" class="form-control" placeholder="Mật khẩu">

            </div>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-shield-lock"></i>

                </span>

                <input type="password" class="form-control" placeholder="Xác nhận mật khẩu">

            </div>

            <div class="form-check mb-4">

                <input class="form-check-input" type="checkbox" id="agree">

                <label class="form-check-label" for="agree">

                    Tôi đồng ý với điều khoản sử dụng

                </label>

            </div>

            <button class="btn-register">

                Đăng ký

            </button>

        </form>

        <hr>

        <div class="bottom">

            Đã có tài khoản?

            <a href="login.html" href="login.html">

                Đăng nhập

            </a>

        </div>

        <div class="bottom">

            <a href="index.html">

                <i class="bi bi-arrow-left"></i>

                Quay về trang chủ

            </a>

        </div>

    </div>

</body>

</html>
